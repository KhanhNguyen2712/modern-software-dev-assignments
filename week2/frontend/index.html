<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: rgba(255, 251, 245, 0.92);
        --ink: #1b1a17;
        --muted: #6d655a;
        --accent: #c75b39;
        --accent-dark: #8f381f;
        --line: rgba(27, 26, 23, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(199, 91, 57, 0.22), transparent 28%),
          radial-gradient(circle at bottom right, rgba(160, 126, 84, 0.22), transparent 25%),
          linear-gradient(135deg, #efe3d1, #f7f2ea 48%, #e7dfd3);
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }
      .hero {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 0.95;
      }
      .lead {
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .panel {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: 0 18px 48px rgba(49, 36, 22, 0.08);
      }
      textarea {
        width: 100%;
        min-height: 220px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        resize: vertical;
        font: inherit;
        line-height: 1.5;
        background: rgba(255, 255, 255, 0.72);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }
      .toolbar label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 18px;
        font: inherit;
        cursor: pointer;
        color: #fff7f2;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 10px 20px rgba(143, 56, 31, 0.18);
      }
      button.secondary {
        color: var(--ink);
        background: rgba(27, 26, 23, 0.06);
        box-shadow: none;
      }
      button:hover {
        transform: translateY(-1px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
        margin-top: 18px;
      }
      .section-title {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }
      .muted {
        color: var(--muted);
      }
      .item, .note {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .item:first-child, .note:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .note-meta {
        margin-bottom: 4px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        main {
          padding: 28px 14px 40px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="muted">Week 2 • FastAPI + SQLite + Ollama</p>
        <h1>Action Item Extractor</h1>
        <p class="lead">
          Paste meeting notes, extract actionable work, and inspect the notes you have saved.
        </p>
      </section>

      <section class="panel">
        <label for="text" class="section-title">Notes</label>
        <textarea
          id="text"
          placeholder="Paste notes here...
e.g.
- [ ] Set up database
TODO: confirm API fields
Next: write tests"
        ></textarea>

        <div class="toolbar">
          <label><input id="save_note" type="checkbox" checked /> Save note before extracting</label>
          <button id="extract">Extract</button>
          <button id="extract_llm">Extract LLM</button>
          <button id="list_notes" class="secondary">List Notes</button>
        </div>

        <div class="status" id="status"></div>
      </section>

      <section class="grid">
        <div class="panel">
          <h2 class="section-title">Action Items</h2>
          <div id="items"><p class="muted">No extracted items yet.</p></div>
        </div>

        <div class="panel">
          <h2 class="section-title">Saved Notes</h2>
          <div id="notes"><p class="muted">No notes loaded yet.</p></div>
        </div>
      </section>
    </main>

    <script>
      const $ = (selector) => document.querySelector(selector);
      const itemsEl = $('#items');
      const notesEl = $('#notes');
      const statusEl = $('#status');

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function escapeHtml(value) {
        return value
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function renderItems(items) {
        if (!items || items.length === 0) {
          itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
          return;
        }

        itemsEl.innerHTML = items.map((item) => `
          <div class="item">
            <input type="checkbox" data-id="${item.id}" ${item.done ? 'checked' : ''} />
            <div>
              <div>${escapeHtml(item.text)}</div>
              <div class="note-meta">${item.created_at ? escapeHtml(item.created_at) : 'Saved just now'}</div>
            </div>
          </div>
        `).join('');

        itemsEl.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
          checkbox.addEventListener('change', async (event) => {
            const id = event.target.getAttribute('data-id');
            await fetch(`/action-items/${id}/done`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: event.target.checked }),
            });
          });
        });
      }

      function renderNotes(notes) {
        if (!notes || notes.length === 0) {
          notesEl.innerHTML = '<p class="muted">No saved notes found.</p>';
          return;
        }

        notesEl.innerHTML = notes.map((note) => `
          <article class="note">
            <div class="note-meta">#${note.id} • ${escapeHtml(note.created_at)}</div>
            <div>${escapeHtml(note.content)}</div>
          </article>
        `).join('');
      }

      async function extract(endpoint, label) {
        const text = $('#text').value;
        const saveNote = $('#save_note').checked;
        setStatus(`${label} in progress...`);

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: saveNote }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || `${label} failed`);
          }

          renderItems(data.items);
          setStatus(`${label} completed${data.note_id ? ` and saved note #${data.note_id}` : ''}.`);
        } catch (error) {
          console.error(error);
          setStatus(error.message || `${label} failed.`);
          itemsEl.innerHTML = '<p class="muted">Unable to extract action items.</p>';
        }
      }

      async function loadNotes() {
        setStatus('Loading saved notes...');
        try {
          const response = await fetch('/notes');
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Failed to load notes');
          }
          renderNotes(data);
          setStatus(`Loaded ${data.length} saved notes.`);
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Failed to load notes.');
          notesEl.innerHTML = '<p class="muted">Unable to load notes.</p>';
        }
      }

      $('#extract').addEventListener('click', () => extract('/action-items/extract', 'Heuristic extraction'));
      $('#extract_llm').addEventListener('click', () => extract('/action-items/extract-llm', 'LLM extraction'));
      $('#list_notes').addEventListener('click', loadNotes);
    </script>
  </body>
</html>

[project]
name = "weather-mcp-server"
version = "1.0.0"
description = "FastAPI + FastMCP weather server backed by Open-Meteo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",          # async test client
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
